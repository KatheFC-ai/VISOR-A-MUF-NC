<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contaminación física por partículas metálicas — Muffin Sabor Coco 80 g</title><style>*{box-sizing:border-box}body{margin:0;background:#1E2761;color:#fff;font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}#sl{flex:1;overflow:auto;padding:2.2rem 6vw}h2{font-family:Georgia,serif;font-size:clamp(1.5rem,3.4vw,2.6rem);margin:0 0 1.2rem}.bd{background:#fff;color:#2A2F3A;border-radius:8px;padding:1.2rem 1.4rem;font-size:clamp(1rem,1.9vw,1.5rem)}table{width:100%;border-collapse:collapse;font-size:clamp(.9rem,1.7vw,1.3rem)}th{background:#1E2761;color:#fff;text-align:left;padding:.5rem .6rem;font-size:clamp(.8rem,1.4vw,1.1rem)}td{padding:.55rem .6rem;border-bottom:1px solid #DDE2F0;vertical-align:top}.k{font-weight:700}.tag{display:inline-block;font-size:.8em;font-weight:700;padding:.1rem .5rem;border-radius:3px;background:#CADCFC;color:#1E2761}.tag.f{background:#FCEEDD;color:#B5560C}.tag.ok{background:#E6F3E9;color:#1F5E31}.sev{display:inline-block;padding:.2rem .7rem;border-radius:3px;color:#fff;font-weight:700}.sev.Crítica{background:#A6001A}.sev.Mayor{background:#B5560C}.sev.Menor{background:#1F5E31}.nota{background:#FCEEDD;border-left:4px solid #B5560C;padding:.7rem .9rem;margin-top:.8rem}p.big{margin:.5rem 0}.bar{display:flex;justify-content:space-between;align-items:center;padding:.7rem 6vw;color:#CADCFC}button{background:none;border:1.5px solid #CADCFC;color:#CADCFC;border-radius:5px;padding:.4rem .9rem;cursor:pointer;margin-left:.4rem;font-size:.95rem}</style></head><body><div id="sl"></div><div class="bar"><span id="c"></span><span><button id="fs">Pantalla completa (F)</button><button id="pv">← Anterior</button><button id="nx">Siguiente →</button></span></div><script>var SL=[{"t":"Contaminación física por partículas metálicas — Muffin Sabor Coco 80 g","h":"\u003cp class=\"big\">Planta de producción — Línea de Muffins, área de molienda común\u003c/p>\u003cp class=\"big\">07/07/2026, turno mañana (10:30–12:10 h)\u003c/p>"},{"t":"Verificación 5W2H","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Pregunta\u003c/th>\u003cth>Respuesta\u003c/th>\u003cth>Estado\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Qué\u003c/span>\u003c/td>\u003ctd>Partículas metálicas (2–4 mm) en producto terminado Muffin sabor Coco 80 g (Lote MC-070726), por fractura de un martillo de acero inoxidable del Molino de Azúcar No. 1.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Completo\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Por qué\u003c/span>\u003c/td>\u003ctd>Se incumplió el control de peligros físicos: material extraño en producto terminado y ausencia de barrera de detección operativa (ISO 22000 cl. 8.2.4(h), 8.5, 8.9.3; FSSC 22000 v7 2.5.11 d) iii).\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Completo\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Cuándo\u003c/span>\u003c/td>\u003ctd>07/07/2026, turno mañana. Ruido metálico 10:30 h; equipo detenido 10:35 h; línea detenida 12:10 h.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Completo\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Dónde\u003c/span>\u003c/td>\u003ctd>Molino de Azúcar No. 1 (área de molienda común), mezcladoras, línea de Muffins y etapa de envasado.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Completo\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Quién (por rol)\u003c/span>\u003c/td>\u003ctd>Detectó: operador de molienda. Gestionó: supervisor de producción. Reportó el crujido: operador de producción. Control de Calidad no fue notificado de inmediato.\u003c/td>\u003ctd>\u003cspan class=\"tag f\">Falta\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Cómo\u003c/span>\u003c/td>\u003ctd>Ruido metálico, fractura del martillo constatada, 150 kg de azúcar ya molida incorporados al proceso, moldes dañados y partículas visibles en inspección en envasado; detector de metales no operativo.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Completo\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=\"k\">Cuánto\u003c/span>\u003c/td>\u003ctd>150 kg de azúcar; 800 kg de masa cruda y 1,000 kg de producto cocido/empacado destruidos; Bs. 15,000 en moldes; fragmento de ~4×4 cm no recuperado en su totalidad.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Completo\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"No Conformidad — Triple Articulación","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Elemento\u003c/th>\u003cth>Detalle\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Requisito aplicable\u003c/span>\u003c/td>\u003ctd>ISO 22000:2018 cl. 8.2.4(h) / 8.5 / 8.9.3; FSSC 22000 v7 — Requisito Adicional 2.5.11 d) iii (gestión de materia extraña / equipos de detección).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Incumplimiento factual\u003c/span>\u003c/td>\u003ctd>Presencia de partículas metálicas (2–4 mm) en producto terminado, originada por la fractura de un martillo de acero inoxidable del Molino No. 1, agravada por la falta de contención del material ya molido y por la ausencia de una barrera de detección operativa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Evidencia objetiva\u003c/span>\u003c/td>\u003ctd>Lote MC-070726; 07/07/2026, turno mañana, 10:30–12:10 h; 800 kg de masa cruda y la totalidad del producto del periodo destruidos (1,000 kg como referencia documental); Bs. 15,000 en moldes; fragmento del martillo no recuperado en su totalidad.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Severidad\u003c/span>\u003c/td>\u003ctd>\u003cspan class=\"sev Crítica\">Crítica\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"nota\">Se clasifica como Crítica: la presencia de partículas metálicas de 2–4 mm en producto terminado es un peligro físico confirmado, es decir, la seguridad alimentaria se ve directamente afectada. La ausencia de una barrera de detección operativa y la falta de contención del material ya molido refuerzan esta clasificación. El retiro de mercado no fue requerido, según lo confirmado por la organización.\u003c/div>"},{"t":"Diagrama de Ishikawa 6M","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>M\u003c/th>\u003cth>Causa inmediata\u003c/th>\u003cth>Causa raíz sistémica\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Medioambiente / Gestión\u003c/span>\u003c/td>\u003ctd>Un solo responsable de Control de Calidad para varias líneas; no se comunicó de inmediato el incidente.\u003c/td>\u003ctd>Cultura de Calidad e Inocuidad (CCI) no profundizada / no consolidada.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Mano de Obra\u003c/span>\u003c/td>\u003ctd>Se priorizó continuar la producción por sobre la contención.\u003c/td>\u003ctd>Ausencia de protocolo de crisis que defina autoridad y criterios de parada.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Método\u003c/span>\u003c/td>\u003ctd>Protocolo ante crisis no establecido.\u003c/td>\u003ctd>Causa raíz en sí misma — ausencia de procedimiento formal.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Medición / Mantenimiento\u003c/span>\u003c/td>\u003ctd>Rotura del martillo (causa asumida: fatiga de material — no verificada por informe técnico).\u003c/td>\u003ctd>No se realiza mantenimiento preventivo formal sobre equipos críticos.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Máquinas\u003c/span>\u003c/td>\u003ctd>Detector de metales no operativo al momento del incidente.\u003c/td>\u003ctd>Equipo no configurado ni validado por el proveedor; sin barrera de control alternativa durante la transición.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Materiales / Equipos\u003c/span>\u003c/td>\u003ctd>No se realizó revisión completa del molino antes de su puesta en funcionamiento.\u003c/td>\u003ctd>Gestión del Cambio (MOC) no implementada para equipos reubicados/instalados.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"5 Porqués — Hilo A: Falla mecánica y ausencia de MOC","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>#\u003c/th>\u003cth>Pregunta\u003c/th>\u003cth>Causa\u003c/th>\u003cth>Test de reversibilidad\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>¿Por qué hubo partículas metálicas en el producto terminado?\u003c/td>\u003ctd>Azúcar molida contaminada con fragmentos metálicos + ausencia de barrera de detección funcional.\u003c/td>\u003ctd>Válido — evidencia física directa.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>¿Por qué el azúcar contenía fragmentos metálicos?\u003c/td>\u003ctd>Fractura del martillo + material ya molido no contenido antes de integrarse al proceso.\u003c/td>\u003ctd>Válido.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>¿Por qué se fracturó el martillo?\u003c/td>\u003ctd>Fatiga de material (causa asumida, no verificada por informe técnico) + falta de revisión previa a la puesta en marcha.\u003c/td>\u003ctd>Válido, con salto pendiente de cerrar mediante informe metalúrgico real.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>¿Por qué no se realizó revisión ni mantenimiento a un equipo reubicado antes de su arranque?\u003c/td>\u003ctd>No existe procedimiento de Gestión del Cambio (MOC) para equipos reubicados/instalados.\u003c/td>\u003ctd>Válido — confirmado por la organización.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>¿Por qué no existe MOC ni mantenimiento preventivo formalizado?\u003c/td>\u003ctd>Causa raíz sistémica y estructural: el sistema de gestión de activos/equipos no está implementado.\u003c/td>\u003ctd>Confirmado como falla estructural, no transitoria.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"5 Porqués — Hilo B: Contención y comunicación","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>#\u003c/th>\u003cth>Pregunta\u003c/th>\u003cth>Causa\u003c/th>\u003cth>Test de reversibilidad\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>¿Por qué el material contaminado no fue contenido de inmediato?\u003c/td>\u003ctd>Se priorizó continuar producción + no hubo comunicación inmediata al Responsable de CC.\u003c/td>\u003ctd>Válido.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>¿Por qué se priorizó producción sin comunicación inmediata?\u003c/td>\u003ctd>No existe protocolo de gestión de crisis que defina roles, tiempos y criterios de parada obligatoria.\u003c/td>\u003ctd>Válido.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>¿Por qué no había disponibilidad inmediata del responsable de CC?\u003c/td>\u003ctd>Estructura organizacional con un único responsable de CC para varias líneas.\u003c/td>\u003ctd>Válido y sistémico.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"Causas raíz sistémicas","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Causa raíz\u003c/th>\u003cth>Estado\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ausencia de programa formal de mantenimiento preventivo para equipos críticos.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Confirmada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ausencia de procedimiento de Gestión del Cambio (MOC) para instalación/reubicación de equipos.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Confirmada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ausencia de protocolo de gestión de crisis / incidentes de inocuidad.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Confirmada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cobertura organizacional insuficiente de Control de Calidad.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Confirmada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cultura de Calidad e Inocuidad (CCI) no profundizada.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Confirmada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Puesta en marcha de línea nueva sin validación completa de todas las barreras de control críticas.\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Confirmada\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"Corrección inmediata / Contención","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Acción\u003c/th>\u003cth>Estado\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Detención del Molino No. 1 (10:35 h)\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Ejecutada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Habilitación del Molino No. 2 (11:00 h)\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Ejecutada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Detención total de la línea de Muffins (12:10 h)\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Ejecutada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Segregación y destrucción de 800 kg de masa cruda\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Ejecutada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retención y destrucción de la totalidad del producto fabricado y programado en la línea durante el periodo de riesgo\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Ejecutada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reposición de moldes de teflón dañados (Bs. 15,000)\u003c/td>\u003ctd>\u003cspan class=\"tag ok\">Ejecutada\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Comunicación formal y documentada del incidente completo al Responsable de CC\u003c/td>\u003ctd>\u003cspan class=\"tag f\">Pendiente\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Barrera de control temporal (tamizado / imán certificado) mientras el detector no esté validado, obligatoria antes de reiniciar producción\u003c/td>\u003ctd>\u003cspan class=\"tag f\">Pendiente\u003c/span>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"Acciones correctivas de fondo","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Causa raíz\u003c/th>\u003cth>Acción\u003c/th>\u003cth>Responsable\u003c/th>\u003cth>Plazo\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ausencia de mantenimiento preventivo\u003c/td>\u003ctd>Programa de mantenimiento preventivo basado en criticidad para equipos de molienda y dosificación.\u003c/td>\u003ctd>Responsable de Mantenimiento\u003c/td>\u003ctd>60 días\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ausencia de Gestión del Cambio (MOC)\u003c/td>\u003ctd>Procedimiento de MOC obligatorio para equipos trasladados/instalados, con checklist técnico previo a la puesta en marcha y verificación física de ausencia de fragmentos remanentes en el Molino No. 1.\u003c/td>\u003ctd>Ingeniería / Mantenimiento\u003c/td>\u003ctd>45 días\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ausencia de protocolo de gestión de crisis\u003c/td>\u003ctd>Procedimiento formal de manejo de incidentes con criterios de parada obligatoria y matriz de roles y tiempos de notificación.\u003c/td>\u003ctd>Gerencia de Calidad / SGI\u003c/td>\u003ctd>30 días\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cobertura insuficiente de Control de Calidad\u003c/td>\u003ctd>Evaluar y ajustar el esquema de cobertura / suplencia de CC entre líneas simultáneas.\u003c/td>\u003ctd>Gerencia de Calidad\u003c/td>\u003ctd>90 días\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cultura de Calidad e Inocuidad no profundizada\u003c/td>\u003ctd>Plan de fortalecimiento: capacitación, comunicación de riesgos y refuerzo del principio de detener el proceso ante la duda.\u003c/td>\u003ctd>Gerencia de Calidad / RRHH\u003c/td>\u003ctd>90 días\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Validación incompleta de barreras en línea nueva\u003c/td>\u003ctd>Completar calibración, validación y configuración del detector de metales por el proveedor. Sensibilidad: Fe ≥1.5 mm; No-Fe ≥2.0 mm; Acero Inoxidable ≥2.0 mm.\u003c/td>\u003ctd>Producción / Proveedor\u003c/td>\u003ctd>Hasta finales de agosto de 2026\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"Indicadores de eficacia","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Indicador\u003c/th>\u003cth>Tipo\u003c/th>\u003cth>Meta\u003c/th>\u003cth>Frecuencia\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Cumplimiento de mantenimiento preventivo\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>≥ 95%\u003c/td>\u003ctd>Mensual\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cobertura de MOC en equipos trasladados\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>100%\u003c/td>\u003ctd>Por evento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Tiempo de notificación de incidentes a Control de Calidad\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>≤ 1 hora desde la detección\u003c/td>\u003ctd>Por evento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Recurrencia de contaminación física\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>0 NC en 90 días\u003c/td>\u003ctd>Continuo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Disponibilidad / calibración del detector de metales\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>100% desde el reinicio\u003c/td>\u003ctd>Diario / por turno\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sensibilidad del detector — control estadístico (Cpk)\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>Cpk ≥ 1.33 (sugerido), con test pieces Fe/No-Fe/Acero Inox\u003c/td>\u003ctd>Por turno, desde la validación\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Participación en capacitación de CCI\u003c/td>\u003ctd>\u003cspan class=\"tag\">Cuantitativo\u003c/span>\u003c/td>\u003ctd>≥ 90%\u003c/td>\u003ctd>Trimestral\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"Seguimiento 30 / 60 / 90 días","h":"\u003cdiv class=\"tw\">\u003ctable>\u003ctr>\u003cth>Hito\u003c/th>\u003cth>Foco de verificación\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Día 30\u003c/span>\u003c/td>\u003ctd>Protocolo de crisis emitido y socializado. Barrera de control temporal activa y verificada antes de reiniciar producción. Checklist de MOC —incluida la verificación mecánica del Molino No. 1— completado.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Día 60\u003c/span>\u003c/td>\u003ctd>Detector calibrado y validado por el proveedor (fin de agosto). Primer ciclo de mantenimiento preventivo ejecutado. MOC aplicado en al menos un evento real.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan class=k>Día 90\u003c/span>\u003c/td>\u003ctd>Cpk de sensibilidad medido con la configuración real. Cero recurrencia de NC por cuerpos extraños. Resultados de capacitación en CCI. Cierre formal de eficacia del CAPA.\u003c/td>\u003c/tr>\u003c/table>\u003c/div>"},{"t":"Resumen ejecutivo","h":"\u003cp class=\"big\">El 07/07/2026 se identificaron partículas metálicas (2–4 mm) en producto terminado Muffin sabor Coco 80 g (Lote MC-070726), originadas por la fractura de un martillo de acero inoxidable del Molino de Azúcar No. 1. La contaminación llegó al producto terminado porque el material ya molido no fue contenido de inmediato y el detector de metales de envasado no estaba operativo ni validado.\u003c/p>\u003cp class=\"big\">Se destruyó la totalidad del producto fabricado y programado en la línea durante la ventana de riesgo (800 kg de masa cruda y 1,000 kg documentados de producto terminado) y se repusieron los moldes dañados (Bs. 15,000). El análisis identificó seis causas sistémicas, ninguna atribuible a individuos.\u003c/p>\u003cp class=\"big\">El cruce de evidencia confirmó que el detector, de haber estado operativo, tenía sensibilidad suficiente (acero inoxidable ≥2.0 mm) para rechazar partículas de 2–4 mm, lo que refuerza la severidad Crítica.\u003c/p>"},{"t":"Conclusiones","h":"\u003cp class=\"big\">• La contaminación no fue una falla puntual sino la coincidencia de seis brechas sistémicas: mantenimiento, MOC, gestión de crisis, cobertura de Calidad, cultura de inocuidad y validación de barreras críticas.\u003c/p>\u003cp class=\"big\">• La contención resolvió el riesgo inmediato mediante la destrucción total del producto del periodo.\u003c/p>\u003cp class=\"big\">• El CAPA ataca cada causa raíz con responsables, plazos e indicadores verificables a 30, 60 y 90 días.\u003c/p>"},{"t":"Información factual pendiente","h":"\u003cp class=\"big\">• Resultado de la búsqueda física del fragmento faltante del martillo.\u003c/p>\u003cp class=\"big\">• Confirmación del tipo de detector instalado (vertical u horizontal).\u003c/p>\u003cp class=\"big\">• Configuración final que aplique el proveedor, a contrastar con la sensibilidad objetivo.\u003c/p>\u003cp class=\"big\">• Informe metalúrgico real de la fractura del martillo.\u003c/p>"}],k=0;function show(){var s=document.getElementById('sl');s.innerHTML='';var h=document.createElement('h2');h.textContent=SL[k].t;var b=document.createElement('div');b.className='bd';b.innerHTML=SL[k].h;s.appendChild(h);s.appendChild(b);s.scrollTop=0;document.getElementById('c').textContent=(k+1)+' / '+SL.length}function go(d){k=Math.max(0,Math.min(SL.length-1,k+d));show()}function fs(){var e=document.documentElement;if(document.fullscreenElement){document.exitFullscreen()}else if(e.requestFullscreen){e.requestFullscreen()}}document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft')go(-1);else if(e.key==='f'||e.key==='F')fs()});document.getElementById('pv').onclick=function(){go(-1)};document.getElementById('nx').onclick=function(){go(1)};document.getElementById('fs').onclick=fs;show();</script></body></html>
